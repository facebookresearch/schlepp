[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "schlepp"
version = "0.1.0"
description = "Loaders, geometry, and visualisation utilities for the SCHLEPP synthetic dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Meta Reality Labs Research" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "h5py>=3.7",
    "opencv-python>=4.6",
    "Pillow>=9.0",
    "imageio>=2.25",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
viz = ["open3d>=0.17", "trimesh>=4.0", "rerun-sdk>=0.20"]
mhr = ["mhr", "pymomentum"]

[tool.setuptools.packages.find]
where = ["."]
include = ["schlepp*"]
