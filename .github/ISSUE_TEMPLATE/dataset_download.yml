name: Dataset or download issue
description: Report a problem downloading, unpacking, or loading SCHLEPP data.
title: "[Data] "
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing issues
      description: Please search open and closed issues before filing a new one.
      options:
        - label: I have searched the existing issues.
          required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      description: Where are you downloading or reading the data from?
      options:
        - Hugging Face
        - Aria Dataset Explorer
        - Local copy
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code
      description: Paste the exact download, unpacking, or dataset-loading command/code that failed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files and modalities
      description: List the cameras, modalities, chunk files, and sequence IDs involved.
      placeholder: |
        - Cameras:
        - Modalities:
        - Chunk files:
        - Sequence IDs:
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the SCHLEPP package version or commit, Python version, OS, and relevant CLI versions.
      value: |
        - SCHLEPP version or commit:
        - Python:
        - OS:
        - Hugging Face CLI:
      render: markdown
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      description: Paste the relevant traceback or command output.
      render: shell
    validations:
      required: false
